<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src ws://127.0.0.1:8765; style-src 'unsafe-inline' 'self'; script-src 'self';" />
    <title>WPMChecker</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; color: #f8fafc; background: transparent; user-select: none; }
      #shell { box-sizing: border-box; width: 100vw; height: 100vh; border-radius: 18px; background: rgba(15, 23, 42, 0.78); border: 1px solid rgba(148, 163, 184, 0.25); box-shadow: 0 18px 55px rgba(0,0,0,.45); display: grid; grid-template-rows: 1fr auto auto; place-items: center; padding: 10px 14px; -webkit-app-region: drag; backdrop-filter: blur(16px); }
      #wpm { font-size: 54px; font-weight: 850; line-height: .9; letter-spacing: -3px; transition: color .12s ease, opacity .3s ease; }
      #wpm.idle { opacity: .45; }
      #meta { font-size: 12px; color: #cbd5e1; margin-top: -2px; white-space: nowrap; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
      #meter { width: 172px; height: 7px; border-radius: 99px; background: rgba(148,163,184,.25); overflow: hidden; margin-top: 8px; }
      #bar { height: 100%; width: 0%; background: #22c55e; transition: width .08s linear, background .12s ease; }
      #status { position: absolute; top: 8px; right: 11px; width: 7px; height: 7px; border-radius: 50%; background: #ef4444; }
      #status.on { background: #22c55e; }
    </style>
  </head>
  <body>
    <div id="shell">
      <div id="status"></div>
      <div id="wpm" class="idle">--</div>
      <div id="meta">connecting...</div>
      <div id="meter"><div id="bar"></div></div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
