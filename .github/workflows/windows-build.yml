name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Verify release tag matches application versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: python packaging/check_release_version.py "${{ github.ref_name }}"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,build]"

      - name: Test Python backend
        run: python -m pytest -q

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Audit and test Electron shell
        working-directory: electron
        run: npm audit && npm test

      - name: Freeze Python backend
        run: pyinstaller --noconfirm --clean packaging/wpmchecker-backend.spec

      - name: Smoke-test frozen backend and process-tree cleanup
        shell: pwsh
        run: |
          $backend = Resolve-Path "dist/wpmchecker-backend.exe"
          $process = Start-Process -FilePath $backend -ArgumentList "--backend", "synthetic", "--mock-whisper", "serve" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($process.HasExited) {
                throw "Frozen backend exited before opening port 8765 (exit $($process.ExitCode))"
              }
              try {
                $client = [System.Net.Sockets.TcpClient]::new()
                $client.Connect("127.0.0.1", 8765)
                $client.Dispose()
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) {
              throw "Frozen backend did not open port 8765"
            }
          } finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }
          }
          Start-Sleep -Seconds 1
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 8765)
          try {
            $listener.Start()
          } finally {
            $listener.Stop()
          }

      - name: Build Windows installer and portable app
        working-directory: electron
        run: npm run build:win

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash release/*.exe -Algorithm SHA256 |
            Sort-Object Path |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content release/SHA256SUMS.txt

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WPMChecker-Windows-${{ github.sha }}
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified Windows packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: WPMChecker-Windows-${{ github.sha }}
          path: release

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
